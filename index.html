<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <form id="search" class="glass search" autocomplete="off">
      <input id="city" type="text" placeholder="Search for a city" aria-label="City" />
      <button type="submit" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </button>
    </form>

    <section class="glass current">
      <h1 id="location">Boca Raton</h1>
      <div id="temp" class="temp">--°</div>
      <div id="condition">Loading…</div>
      <div id="hilo"></div>
    </section>

    <section class="glass">
      <h2>Hourly Forecast</h2>
      <div id="hourly" class="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-Day Forecast</h2>
      <ul id="daily" class="daily"></ul>
    </section>

    <section class="tiles">
      <div class="glass"><h2>Feels Like</h2><p id="feels">--</p></div>
      <div class="glass"><h2>Humidity</h2><p id="humidity">--</p></div>
      <div class="glass"><h2>Wind</h2><p id="wind">--</p></div>
      <div class="glass"><h2>UV Index</h2><p id="uv">--</p></div>
    </section>

    <p id="error" class="error" hidden></p>
    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
